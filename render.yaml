services:
  - type: web
    name: server  # ← Your actual service name
    repo: https://github.com/rehman786234/server  # Optional
    branch: main
    env: python
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: my-postgres-db  # Your database name
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
